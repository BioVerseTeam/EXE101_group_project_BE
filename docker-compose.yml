services:
  bioverse-postgres:
    image: postgres:16
    container_name: bioverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioverse
      POSTGRES_USER: bioverse
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - bioverse_postgres_data:/var/lib/postgresql/data

volumes:
  bioverse_postgres_data:
