services:
  bioverse-postgres:
    image: postgres:16
    container_name: bioverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bioverse
      POSTGRES_USER: bioverse
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - bioverse_postgres_data:/var/lib/postgresql/data

  bioverse-redis:
    image: redis:7-alpine
    container_name: bioverse-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "6380:6379"
    volumes:
      - bioverse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bioverse_postgres_data:
  bioverse_redis_data:
