spring.application.name=EXE101_Bioverse

spring.config.import=optional:file:.env[.properties]
# local = Docker Postgres | supabase = Postgres trên cloud (mặc định)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:supabase}

server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Long timeout for AI inference (~20 mins/request)
server.tomcat.connection-timeout=30m
spring.mvc.async.request-timeout=30m

# Allow uploading large images
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

# Flyway — do NOT edit applied V*.sql (checksum mismatch → app won't start).
# Schema changes = new Vn__*.sql only. See db/migration/README.md.
# Never set spring.flyway.repair-on-migrate=true permanently in prod.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Firebase
bioverse.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase/serviceAccountKey.json}

# AI Configuration
bioverse.ai.model=openai/gpt-4o-mini
bioverse.ai.temperature=0.3
bioverse.ai.max-tokens=800
bioverse.ai.max-history-messages=8

# OpenRouter
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1

# Cloudflare R2 — 3D model storage (FE gọi /api/models/**, backend lấy file từ bucket)
bioverse.r2.account-id=${R2_ACCOUNT_ID:}
bioverse.r2.access-key-id=${R2_ACCESS_KEY_ID:}
bioverse.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
bioverse.r2.bucket-name=${R2_BUCKET_NAME:bio3d-models}
bioverse.r2.endpoint=${R2_ENDPOINT:}

# JWT — HS256 secret must be at least 32 characters
bioverse.jwt.secret=${JWT_SECRET:BioverseJwtSecretKeyThatIsAtLeastThirtyTwoCharsLong!}
bioverse.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
bioverse.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Redis — local Docker mặc định; deploy thì đổi REDIS_* hoặc REDIS_URL (Upstash / Redis Cloud)
# REDIS_URL (redis:// hoặc rediss://) được ưu tiên hơn host/port
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

# Seed tài khoản mẫu khi start (bỏ qua nếu email đã tồn tại)
bioverse.seed.enabled=${SEED_ENABLED:true}

# Mail — Brevo SMTP (https://app.brevo.com → Settings → SMTP & API)
# MAIL_USERNAME = SMTP login, MAIL_PASSWORD = SMTP key (xsmtpsib-...), MAIL_FROM = sender đã verify
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
bioverse.mail.from=${MAIL_FROM:}
bioverse.mail.from-name=${MAIL_FROM_NAME:BioVerse}
bioverse.mail.app-url=${APP_PUBLIC_URL:https://bioverse.eraidev.id.vn}

# OTP (Redis) — đăng ký và quên mật khẩu
bioverse.otp.length=${OTP_LENGTH:6}
bioverse.otp.ttl-seconds=${OTP_TTL_SECONDS:600}
bioverse.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
bioverse.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
bioverse.otp.reset-token-ttl-seconds=${OTP_RESET_TOKEN_TTL_SECONDS:600}