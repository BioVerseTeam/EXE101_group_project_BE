spring.application.name=EXE101_Bioverse

server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/bioverse
spring.datasource.username=postgres
spring.datasource.password=37470378
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Long timeout for AI inference (~20 mins/request)
server.tomcat.connection-timeout=30m
spring.mvc.async.request-timeout=30m

# Allow uploading large images
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

# Flyway migration settings
# true to allow Flyway to automatically run migration when application starts
# false if you want to run migration manually
spring.flyway.enabled=true

# true to allow Flyway to automatically create schema_version table if not exists
# false if you want to create schema_version table manually
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# src/main/resources/db/migration is the directory containing migration files
spring.flyway.locations=classpath:db/migration

# Firebase
bioverse.firebase.service-account-path=firebase/serviceAccountKey.json

# AI Configuration
bioverse.ai.model=openai/gpt-4o-mini
bioverse.ai.temperature=0.3
bioverse.ai.max-tokens=800
bioverse.ai.max-history-messages=8

# OpenRouter
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1