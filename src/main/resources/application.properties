spring.application.name=EXE101_Bioverse

server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/bioverse
spring.datasource.username=postgres
spring.datasource.password=37470378
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Timeout dài cho AI inference (~20 phút/l?n)
server.tomcat.connection-timeout=30m
spring.mvc.async.request-timeout=30m

# Cho phép upload ?nh l?n
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

# Flyway migration settings
# true ?? cho phép Flyway t? ??ng ch?y migration khi ?ng d?ng kh?i ??ng
# false n?u mu?n ch?y migration b?ng tay
spring.flyway.enabled=true

# true ?? cho phép Flyway t? ??ng t?o b?ng schema_version n?u ch?a t?n t?i
# false n?u mu?n t? t?o b?ng schema_version b?ng tay
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# src/main/resources/db/migration là th? m?c ch?a các file migration
spring.flyway.locations=classpath:db/migration