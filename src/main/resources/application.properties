spring.application.name=EXE101_Bioverse

server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5434/bioverse
spring.datasource.username=bioverse
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Firebase
bioverse.firebase.service-account-path=firebase/serviceAccountKey.json

# AI Configuration
bioverse.ai.model=openai/gpt-4o-mini
bioverse.ai.temperature=0.3
bioverse.ai.max-tokens=800
bioverse.ai.max-history-messages=8

# OpenRouter
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1
