spring.application.name=EXE101_Bioverse

spring.config.import=optional:file:.env[.properties]
# local = Docker Postgres | supabase = Postgres trên cloud (mặc định)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:supabase}

server.port=8088

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Long timeout for AI inference (~20 mins/request)
server.tomcat.connection-timeout=30m
spring.mvc.async.request-timeout=30m

# Allow uploading large images
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

# Flyway migration settings
# true to allow Flyway to automatically run migration when application starts
# false if you want to run migration manually
spring.flyway.enabled=true

# true to allow Flyway to automatically create schema_version table if not exists
# false if you want to create schema_version table manually
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# src/main/resources/db/migration is the directory containing migration files
spring.flyway.locations=classpath:db/migration

# Firebase
bioverse.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase/serviceAccountKey.json}

# AI Configuration
bioverse.ai.model=openai/gpt-4o-mini
bioverse.ai.temperature=0.3
bioverse.ai.max-tokens=800
bioverse.ai.max-history-messages=8

# OpenRouter
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.base-url=https://openrouter.ai/api/v1

# JWT — HS256 secret must be at least 32 characters
bioverse.jwt.secret=${JWT_SECRET:BioverseJwtSecretKeyThatIsAtLeastThirtyTwoCharsLong!}
bioverse.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
bioverse.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Redis — local Docker mặc định; deploy thì đổi REDIS_* hoặc REDIS_URL (Upstash / Redis Cloud)
# REDIS_URL (redis:// hoặc rediss://) được ưu tiên hơn host/port
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

# Seed tài khoản mẫu khi start (bỏ qua nếu email đã tồn tại)
bioverse.seed.enabled=${SEED_ENABLED:true}

# Mail — Gmail: bật 2FA rồi tạo App Password, điền MAIL_USERNAME / MAIL_PASSWORD
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
bioverse.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
bioverse.mail.from-name=${MAIL_FROM_NAME:Bioverse}

# OTP (Redis) — đăng ký và quên mật khẩu
bioverse.otp.length=${OTP_LENGTH:6}
bioverse.otp.ttl-seconds=${OTP_TTL_SECONDS:600}
bioverse.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
bioverse.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
bioverse.otp.reset-token-ttl-seconds=${OTP_RESET_TOKEN_TTL_SECONDS:600}