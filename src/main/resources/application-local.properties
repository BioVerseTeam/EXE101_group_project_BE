# Profile local → chỉ đọc LOCAL_DB_*
spring.datasource.url=jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5434}/${LOCAL_DB_NAME:bioverse}?sslmode=${LOCAL_DB_SSLMODE:disable}
spring.datasource.username=${LOCAL_DB_USERNAME:bioverse}
spring.datasource.password=${LOCAL_DB_PASSWORD:123456}
spring.datasource.hikari.maximum-pool-size=${LOCAL_DB_POOL_SIZE:10}
